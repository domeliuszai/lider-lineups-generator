<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lineups Generator">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Lineups Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#0b0b0c;--panel:#141112;--panel2:#1b1516;--line:#3a1d1b;
  --neon:#ff2b1c;--hot:#ff7a6b;--logo:#d92318;--ink:#f6efec;--mut:#a39390;
  --paper:#fffdfb;--pink:#fbefec;--pos:#13763a;--neg:#c4191a;
  --disp:'Special Elite','Courier New',monospace;--num:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif;
  --glow:0 0 4px rgba(255,90,70,.9),0 0 14px rgba(255,43,28,.75),0 0 34px rgba(255,43,28,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--floor)}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.4 var(--body);
  background:
   linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
   url(parquet.jpg) 0 0/820px auto repeat,
   var(--floor)}
main{max-width:560px;margin:0 auto;padding:0 16px max(32px,env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid #fff;outline-offset:2px}

.hero{margin:0 -16px;display:flex;justify-content:center;padding-top:env(safe-area-inset-top)}
.hero .fr{position:relative;display:block}
.hero img{height:min(50vh,430px);width:auto;max-width:100%;display:block;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(0deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent),linear-gradient(0deg,transparent,#000 10%,#000 90%,transparent);mask-composite:intersect;
  animation:on 1.2s linear 1 both}
@keyframes on{0%{opacity:.12}12%{opacity:1}18%{opacity:.25}24%{opacity:1}30%{opacity:.5}36%,100%{opacity:1}}
h1{font:400 30px/1.05 var(--disp);margin:2px 0 4px;text-align:center;text-shadow:var(--glow)}
.sub{margin:0 0 22px;text-align:center;color:var(--mut);font-size:15px}

.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:30px}
.btns button{font:inherit;color:var(--ink);cursor:pointer;min-height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  background:rgba(20,17,18,.86);border:2px solid var(--neon);border-radius:14px;padding:12px 10px;
  box-shadow:0 0 12px rgba(255,43,28,.5),inset 0 0 14px rgba(255,43,28,.22);transition:background .15s,box-shadow .15s}
.btns small{font:500 14px/1.1 var(--body);color:var(--hot)}
.btns b{font:700 28px/1 var(--num);letter-spacing:.01em}
.btns button:active{background:var(--neon);box-shadow:0 0 22px rgba(255,43,28,.9)}
.btns button:active small{color:#fff}

h2{font:400 24px/1 var(--disp);margin:0 0 12px;text-shadow:0 0 10px rgba(255,43,28,.6)}
.m{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:12px 14px;margin-bottom:10px;
  background:rgba(20,17,18,.8);border:1px solid var(--line);border-radius:10px}
.m .d{font-size:13.5px;color:var(--mut)}
.m .n{font:600 21px/1.1 var(--num);overflow-wrap:anywhere}
.m .s{text-align:right;font:700 34px/1 var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.m .s i{display:block;font:500 12.5px/1.3 var(--body);font-style:normal;color:var(--mut)}
.m .s em{font-style:normal;color:var(--mut);font-weight:500}
.m.p{cursor:pointer;background:rgba(27,21,22,.9)}
.m.p.w{border:1.5px solid rgba(60,235,120,.75);box-shadow:0 0 16px rgba(46,230,110,.45),inset 0 0 18px rgba(46,230,110,.12)}
.m.p.l{border:1.5px solid rgba(255,59,44,.8);box-shadow:0 0 16px rgba(255,43,28,.5),inset 0 0 18px rgba(255,43,28,.14)}
.m.p:active{filter:brightness(1.25)}
.m .s b{color:#fff}
.m:not(.p){border-style:dashed;opacity:.62}
.m:not(.p) .s{font-size:22px;color:var(--mut)}
#msg{color:var(--mut);padding:18px 0;text-align:center}

.ov{position:fixed;inset:0;background:rgba(5,3,3,.78);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.ov.on{display:flex}
.box{background:var(--panel);border:2px solid var(--neon);border-radius:16px;padding:22px;max-width:380px;width:100%;
  box-shadow:0 0 28px rgba(255,43,28,.55),inset 0 0 22px rgba(255,43,28,.18)}
.box h3{font:400 22px/1.15 var(--disp);margin:0 0 8px;text-shadow:0 0 10px rgba(255,43,28,.6)}
.box p{margin:0 0 18px;color:var(--ink)}
.box .row{display:flex;gap:10px}
.box button,.bar button{font:700 19px/1 var(--num);padding:14px;border-radius:10px;cursor:pointer;color:var(--ink);
  background:transparent;border:2px solid var(--neon);flex:1}
.box button.y,.bar #dl{background:var(--neon);color:#fff;box-shadow:0 0 16px rgba(255,43,28,.7)}
.box button:active,.bar button:active{filter:brightness(.85)}
.sub2{color:var(--mut);font-size:14px}
#busy .box{text-align:center}

#rep{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;
  background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),url(parquet.jpg) 0 0/820px auto repeat,var(--floor)}
#rep.on{display:flex}
.bar{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));
  background:rgba(11,11,12,.94);border-bottom:1px solid var(--neon);box-shadow:0 2px 18px rgba(255,43,28,.35)}
.bar button{flex:0 1 auto;padding:12px 16px}
#rbody{overflow:auto;flex:1;padding:14px 12px 28px}

#doc{background:var(--paper);color:#1c1514;max-width:820px;margin:0 auto;padding:20px;border-radius:6px;
  font:13px/1.4 var(--body);box-shadow:0 8px 40px rgba(0,0,0,.7)}
#doc .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:3px solid var(--logo);padding-bottom:10px;margin-bottom:6px}
#doc .dh img{width:74px;height:74px;flex:none}
#doc h3{font:400 22px/1.1 var(--disp);color:var(--logo);margin:0 0 6px}
#doc h4{font:400 15px/1.2 var(--disp);color:var(--logo);margin:16px 0 5px}
#doc p{margin:4px 0}
#doc table{border-collapse:collapse;width:100%;margin-top:6px;font:500 12.5px/1.25 var(--num)}
#doc th,#doc td{border:1px solid #e2c9c5;padding:4px 6px;text-align:center}
#doc th{background:var(--logo);color:#fff;border-color:var(--logo);font-weight:600}
#doc td:first-child,#doc th:first-child{text-align:left}
#doc table.mt td:nth-child(2),#doc table.mt th:nth-child(2){text-align:left}
#doc tr:nth-child(even) td{background:var(--pink)}
#doc tr.g2 td{background:#fde9e6}#doc tr.g3 td{background:#fbf2df}#doc tr.g4 td{background:#e9eef5}
#doc tr.grp td{font:600 13px/1.2 var(--num);text-align:left;border-top:2px solid #1c1514}
#doc tr.grp.g2 td{background:#f4b8b0;color:#6e1009}#doc tr.grp.g3 td{background:#ecd29f;color:#5a4108}#doc tr.grp.g4 td{background:#bfcad9;color:#1f3150}
#doc .pos{color:var(--pos);font-weight:700}#doc .neg{color:var(--neg);font-weight:700}
#doc .note{color:#6b5a57;font-size:11.5px}
@media(prefers-reduced-motion:reduce){.hero img{animation:none}*{transition:none!important}}
@media(min-width:600px){body{font-size:18px}}
</style>
</head>
<body>
<main>
<div class="hero"><span class="fr"><img src="lider-neon.jpg" alt="Neonowe logo Lider Swarzędz: serce w kształcie piłki do koszykówki"></span></div>
<h1>Lineups Generator</h1>
<p class="sub">Najlepsze piątki Lidera w 1 lidze kobiet</p>

<div class="btns">
<button data-k="1" data-t="Raport za ostatni mecz"><small>Raport za</small><b>ostatni mecz</b></button>
<button data-k="3" data-t="Średnia z ostatnich 3 meczów"><small>Średnia z ostatnich</small><b>3 meczów</b></button>
<button data-k="5" data-t="Średnia z ostatnich 5 meczów"><small>Średnia z ostatnich</small><b>5 meczów</b></button>
<button data-k="0" data-t="Raport całościowy"><small>Raport</small><b>całościowy</b></button>
</div>

<h2>Terminarz</h2>
<div id="list"><div id="msg">Ładuję terminarz…</div></div>
</main>

<div class="ov" id="ask"><div class="box"><h3>Raport z meczu?</h3><p id="askq"></p><div class="row"><button id="no">Nie</button><button class="y" id="yes">Tak, generuj</button></div></div></div>
<div class="ov" id="busy"><div class="box"><h3>Generuję raport</h3><p class="sub2" style="margin:0">Pierwszy raz może potrwać kilka sekund.</p></div></div>
<div id="rep"><div class="bar"><button id="dl">Pobierz PDF</button><button id="cl">Zamknij raport</button></div><div id="rbody"><div id="doc"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const API='https://gndhniehmzeezzqwsbpg.supabase.co/functions/v1/lineups';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace('GMMInoxMergerLogisticsPanteryŁańcut','GMMInox Merger Logistics Pantery Łańcut').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SCH=[],fname='raport.pdf';
const isL=n=>n.startsWith('Lider');
const played=()=>SCH.filter(m=>m.hs!=null);
const fm=s=>(s/60).toFixed(1).replace('.',',');
const sg=n=>(n>0?'+':'')+n;
const cls=n=>n>0?'pos':n<0?'neg':'';
const DOW=['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];
function when(d){const [dd,mm,rest]=d.split('.');const y=rest.slice(0,4),t=rest.slice(5);
  const w=DOW[new Date(+y,+mm-1,+dd).getDay()];return `${w} ${dd}.${mm}${t?', '+t:''}`}
async function api(q){const r=await fetch(API+'?'+q);const d=await r.json();if(d.error)throw new Error(d.error);return d}

function render(){
  $('#list').innerHTML='';
  for(const m of SCH){
    const p=m.hs!=null,lh=isL(m.home),opp=lh?m.away:m.home;
    const us=p?(lh?m.hs:m.as):null,them=p?(lh?m.as:m.hs):null,win=p&&us>them;
    const d=document.createElement('div');d.className='m'+(p?' p '+(win?'w':'l'):'');
    if(p){d.tabIndex=0;d.setAttribute('role','button')}
    d.innerHTML=`<div><div class="d">${when(m.date)}, ${lh?'u siebie':'wyjazd'}</div><div class="n">${esc(opp)}</div></div>`+
      `<div class="s">${p?`<b>${us}</b><em>:${them}</em><i>${win?'wygrana':'przegrana'}</i>`:'—'}</div>`;
    if(p){d.onclick=()=>ask(m);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ask(m)}}}
    $('#list').append(d);
  }
}
async function init(){
  let cached=null;
  try{cached=JSON.parse(localStorage.getItem('sched'))}catch(e){}
  if(cached&&cached.length){SCH=cached;render()}
  try{
    const fresh=await api('action=schedule');
    if(JSON.stringify(fresh)!==JSON.stringify(SCH)){SCH=fresh;render()}
    try{localStorage.setItem('sched',JSON.stringify(fresh))}catch(e){}
  }catch(e){if(!SCH.length)$('#msg').textContent='Nie udało się pobrać terminarza ('+e.message+'). Odśwież stronę.'}
}
function ask(m){
  $('#askq').textContent=`${m.home.replace('GMMInoxMergerLogisticsPanteryŁańcut','GMMInox Merger Logistics Pantery Łańcut')} – ${m.away} (${m.hs}:${m.as}). Pobrać raport z tego meczu?`;
  $('#ask').classList.add('on');
  $('#no').onclick=()=>$('#ask').classList.remove('on');
  $('#yes').onclick=()=>{$('#ask').classList.remove('on');open_([m],'m')};
}
document.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k,pl=played();
  if(!pl.length)return alert('Brak rozegranych meczów.');
  open_(k?pl.slice(-k):pl,k===1?'m':'a',b.dataset.t);
});
async function open_(ms,type,label){
  $('#busy').classList.add('on');
  try{
    const data=await api('action=match&ids='+ms.map(m=>m.id).join(','));
    const by=Object.fromEntries(data.map(d=>[d.id,d]));
    const arr=ms.map(m=>({...by[m.id],date:m.date}));
    $('#doc').innerHTML=type==='m'?repMatch(arr[0]):repAgg(arr,label);
    fname=(type==='m'?'Lider_piatki_'+arr[0].date.slice(0,10):'Lider_top10_'+arr.length+'_meczow')+'.pdf';
    $('#rep').classList.add('on');$('#rbody').scrollTop=0;
  }catch(e){alert('Nie udało się pobrać raportu: '+e.message)}
  $('#busy').classList.remove('on');
}
$('#cl').onclick=()=>$('#rep').classList.remove('on');
$('#dl').onclick=async()=>{
  const b=$('#dl');b.disabled=true;b.textContent='Tworzę PDF…';
  window.scrollTo(0,0);$('#rbody').scrollTop=0;
  const c=$('#doc').cloneNode(true);c.style.cssText='width:740px;max-width:none;margin:0;border-radius:0;box-shadow:none';
  try{await document.fonts.ready;await html2pdf().set({margin:10,filename:fname,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css','legacy'],avoid:'tr'}}).from(c).save()}
  catch(e){alert('Nie udało się utworzyć PDF: '+e.message)}
  b.disabled=false;b.textContent='Pobierz PDF';
};
const dh=(t,meta)=>`<div class="dh"><div><h3>${t}</h3>${meta}</div><img src="logo-lider.jpg" alt=""></div>`;
const row=l=>`<tr><td>${esc(l.p.join(', '))}</td><td>${fm(l.sec)}</td><td>${l.pf}:${l.pa}</td><td class="${cls(l.pf-l.pa)}">${sg(l.pf-l.pa)}</td><td>${l.sec>=1?sg(Math.round((l.pf-l.pa)/l.sec*600)):'-'}</td></tr>`;
function repMatch(d){
  const ls=[...d.lineups].sort((a,b)=>(b.pf-b.pa)-(a.pf-a.pa));
  const big=ls.filter(l=>l.sec>=120),pool=big.length?big:ls;
  const f=l=>`<b>${esc(l.p.join(', '))}</b> – ${fm(l.sec)} min, ${l.pf}:${l.pa} (<span class="${cls(l.pf-l.pa)}">${sg(l.pf-l.pa)}</span>)`;
  const lg=ls.reduce((a,b)=>b.sec>a.sec?b:a);
  return dh('Skuteczność piątek',`<p>${esc(d.home)} – ${esc(d.away)} <b>${d.hs}:${d.as}</b> (${esc(d.date)}).</p>`)+
  `<h4>Najlepsza piątka (min. 2 min)</h4><p>${f(pool[0])}</p>
  <h4>Najsłabsza piątka (min. 2 min)</h4><p>${f(pool[pool.length-1])}</p>
  <h4>Najdłużej grająca piątka</h4><p>${f(lg)}<br>Piątka startowa: ${esc(d.start.join(', '))}.</p>
  <h4>Wszystkie piątki (${ls.length}) wg różnicy punktów</h4>
  <table><tr><th>Piątka</th><th>Czas</th><th>Wynik</th><th>Różn.</th><th>Na 10 min</th></tr>${ls.map(row).join('')}</table>
  <h4>Ograniczenia</h4><p class="note">Różnica punktów liczona z wyniku przy każdej akcji (suma zgadza się z wynikiem). Próbki małe – wnioski ostrożne. Piątka startowa ustalona z pierwszych akcji, nie z protokołu.</p>`;
}
function subs(p,k){const o=[];(function f(i,c){if(c.length===k){o.push(c.slice());return}for(;i<p.length;i++){c.push(p[i]);f(i+1,c);c.pop()}})(0,[]);return o}
const MINSEC={2:720,3:480,4:300};
function combos(arr,k){
  const M=new Map();
  for(const d of arr){const seen=new Set();
    for(const l of d.lineups)for(const s of subs(l.p,k)){const key=s.join('|');
      const a=M.get(key)||{p:s,g:0,sec:0,pf:0,pa:0};a.sec+=l.sec;a.pf+=l.pf;a.pa+=l.pa;
      if(!seen.has(key)){seen.add(key);a.g++}M.set(key,a)}}
  const R=[...M.values()].filter(a=>a.sec>=MINSEC[k]).sort((a,b)=>(b.pf-b.pa)/b.sec-(a.pf-a.pa)/a.sec);
  return R.length?{best:R[0],worst:R[R.length-1]}:null;
}
function repAgg(arr,label){
  const A=new Map();let pf=0,pa=0;
  for(const d of arr){pf+=d.lider;pa+=d.against;
    for(const l of d.lineups){const k=l.p.join('|');const a=A.get(k)||{p:l.p,g:0,sec:0,pf:0,pa:0};a.g++;a.sec+=l.sec;a.pf+=l.pf;a.pa+=l.pa;A.set(k,a)}}
  const F=[...A.values()].filter(a=>a.sec>=180).sort((a,b)=>(b.pf-b.pa)/b.sec-(a.pf-a.pa)/a.sec);
  const R=F.slice(0,10),W=F.slice(Math.max(10,F.length-5)).reverse();
  const tr=(a,t,c)=>{const df=a.pf-a.pa;return `<tr${c?` class="${c}"`:''}><td>${t} ${esc(a.p.join(', '))}</td><td>${a.g}</td><td>${fm(a.sec)}</td><td>${fm(a.sec/a.g)}</td><td class="${cls(df)}">${sg(Math.round(df/a.g*10)/10).replace('.',',')}</td><td class="${cls(df)}">${sg(Math.round(df/a.sec*6000)/10).replace('.',',')}</td></tr>`};
  const head='<tr><th>Piątka</th><th>Mecze</th><th>Min łącznie</th><th>Śr. min / mecz</th><th>Śr. różn. / mecz</th><th>Na 10 min</th></tr>';
  const rows=R.map((a,i)=>tr(a,(i+1)+'.')).join('');
  const wrows=W.map((a,i)=>tr(a,(i+1)+'.')).join('');
  const lg=[...A.values()].reduce((a,b)=>b.sec>a.sec?b:a);
  const mt=arr.map(d=>`<tr><td>${esc(d.date.slice(0,10))}</td><td>${esc(d.home)} – ${esc(d.away)}</td><td><b>${d.hs}:${d.as}</b></td></tr>`).join('');
  const NM={2:'dwójka',3:'trójka',4:'czwórka'},NP={2:'Dwójki',3:'Trójki',4:'Czwórki'};
  const crow=[2,3,4].map(k=>{const c=combos(arr,k),g='g'+k;
    const h=`<tr class="grp ${g}"><td colspan="6">${NP[k]} (min. ${MINSEC[k]/60} min łącznie)</td></tr>`;
    if(!c)return h+`<tr class="${g}"><td colspan="6">brak takich zestawów</td></tr>`;
    return h+tr(c.best,'Najlepsza '+NM[k]+':',g)+tr(c.worst,'Najgorsza '+NM[k]+':',g)}).join('');
  return dh('Najlepsze i najgorsze piątki',`<p><b>${esc(label.replace('Raport ','Raport: '))}</b> (${arr.length} ${arr.length===1?'mecz':arr.length<5?'mecze':'meczów'}, razem ${pf}:${pa} dla Lidera).</p>`)+
  `<h4>Mecze w zestawieniu</h4><table class="mt"><tr><th>Data</th><th>Mecz</th><th>Wynik</th></tr>${mt}</table>
  <h4>10 najlepszych piątek (różnica na 10 min, min. 3 min łącznie)</h4>
  <table>${head}${rows||'<tr><td colspan="6">Brak piątek z min. 3 min łącznie.</td></tr>'}</table>
  <h4>5 najgorszych piątek (min. 3 min łącznie)</h4>
  <table>${head}${wrows||'<tr><td colspan="6">Za mało piątek, by wskazać najgorsze.</td></tr>'}</table>
  <h4>Najlepsze i najgorsze dwójki, trójki i czwórki</h4>
  <p class="note">Zestawy zawodniczek razem na boisku (w dowolnej piątce), sumowane ze wszystkich meczów.</p>
  <table><tr><th>Zestaw</th><th>Mecze</th><th>Min łącznie</th><th>Śr. min / mecz</th><th>Śr. różn. / mecz</th><th>Na 10 min</th></tr>${crow}</table>
